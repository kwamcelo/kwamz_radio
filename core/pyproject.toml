[project]
name = "kwamz-radio-core"
version = "0.1.0"
description = "Shared models and DB access."
requires-python = ">=3.12"
dependencies = [
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwamz_core"]
