[project]
name = "kwam-radio-pipeline"
version = "0.1.0"
description = "Data import and song matching."
requires-python = ">=3.12"
dependencies = ["kwam-radio-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwam_pipeline"]

[tool.uv.sources]
kwam-radio-core = { workspace = true }
