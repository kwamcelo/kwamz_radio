[project]
name = "kwamz-radio-ml"
version = "0.1.0"
description = "Model training and evaluation."
requires-python = ">=3.12"
dependencies = ["kwamz-radio-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwamz_ml"]

[tool.uv.sources]
kwamz-radio-core = { workspace = true }
