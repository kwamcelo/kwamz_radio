[project]
name = "kwam-radio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kwam-radio-core",
    "kwam-radio-api",
    "kwam-radio-ml",
    "kwam-radio-pipeline",
]

[tool.uv]
package = false

[tool.uv.sources]
kwam-radio-core = { workspace = true }
kwam-radio-api = { workspace = true }
kwam-radio-ml = { workspace = true }
kwam-radio-pipeline = { workspace = true }

[tool.uv.workspace]
members = ["core", "api", "ml", "pipeline"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["core/tests", "api/tests", "ml/tests", "pipeline/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["kwam_core", "kwam_api", "kwam_ml", "kwam_pipeline"]

[tool.pyright]
include = ["core/src", "api/src", "ml/src", "pipeline/src", "core/tests", "api/tests", "ml/tests", "pipeline/tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
