[project]
name = "kwamz-radio-api"
version = "0.1.0"
description = "FastAPI backend."
requires-python = ">=3.12"
dependencies = [
    "kwamz-radio-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "psycopg-pool>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwamz_api"]

[tool.uv.sources]
kwamz-radio-core = { workspace = true }
