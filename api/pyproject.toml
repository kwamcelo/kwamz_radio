[project]
name = "kwam-radio-api"
version = "0.1.0"
description = "FastAPI backend."
requires-python = ">=3.12"
dependencies = ["kwam-radio-core", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwam_api"]

[tool.uv.sources]
kwam-radio-core = { workspace = true }
